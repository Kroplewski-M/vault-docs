[package]
name = "db"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = [
  "tls-native-tls",
  "runtime-async-std",
  "postgres",
  "chrono",
  "uuid",
] }
uuid = { workspace = true }
chrono = { workspace = true }
pgvector = { version = "0.4.2", features = ["sqlx"] }
