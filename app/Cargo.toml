[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
leptos = "0.8.20"
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
leptos_axum = { version = "0.8.10", optional = true }
server_fn = { version = "0.8", features = ["multipart"] }
uuid = { workspace = true }
chrono = { workspace = true }
services = { path = "../services", optional = true }
axum = { version = "0.8.9", optional = true }
web-sys = { workspace = true }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
[features]
hydrate = ["leptos/hydrate"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:services",
  "dep:axum",
]
