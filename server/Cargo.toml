[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app", default-features = false, features = ["ssr"] }
db = { path = "../db" }
dotenvy = "0.15.7"
leptos = { version = "0.8.0", features = ["ssr"] }
leptos_axum = "0.8.0"
axum = "0.8.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
openidconnect = "4.0.1"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private"] }
domain = { version = "0.1.0", path = "../domain", features = ["sqlx"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono.workspace = true
serde.workspace = true
url = "2.5.8"
serde_json = "1.0.151"
